name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate sources
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n1)
          if [ -n "$ZIP" ]; then
            unzip -q -o "$ZIP" -d unpacked
            SRC=$(dirname "$(find unpacked -name pubspec.yaml | head -n1)")
          else
            SRC=.
          fi
          echo "SRC=$SRC" >> $GITHUB_ENV
          echo "Using sources in $SRC"

      - name: Create Android wrapper and copy sources
        run: |
          flutter create --org com.bankshotpro --project-name bank_shot_pro --platforms android build_app
          rm -rf build_app/lib build_app/test
          cp -r "$SRC/lib" "$SRC/test" "$SRC/pubspec.yaml" build_app/

      - name: Get packages
        working-directory: build_app
        run: flutter pub get

      - name: Unit tests (result shown, does not block the APK)
        working-directory: build_app
        continue-on-error: true
        run: flutter test

      - name: Build universal release APK
        working-directory: build_app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: bank-shot-pro-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
